<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2965" viewBox="0 0 1800 2965" role="img" aria-labelledby="title description">
<title id="title">The hermeneutic engine: reading path, built work, safety use and theory lenses</title><desc id="description">Four panels explain the engine. Ten numbered steps sit over an append-only ledger. Built capabilities include theory lenses: a declared framework in a letter, exact quotation, counter-evidence and a rival. Searches by another family and replies to theory readings remain on the build list.</desc>
<style>svg{background:#f4f0e7}text{fill:#25231f;font-family:"Courier New",Courier,monospace}.heading{font-family:Georgia,"Times New Roman",serif}.card-title{font-weight:bold}.red{fill:#b52d25}.rule{stroke:#d7d0c3;stroke-width:2}.red-line{stroke:#b52d25;stroke-width:2}</style>
<path fill="#f4f0e7" d="M0 0H1800V2965H0Z"/>
<text x="64" y="88" class="heading" font-size="48"><tspan x="64" dy="0">The hermeneutic engine</tspan></text><path d="M64 142H1736" class="red-line"/><text x="64" y="186" class="red" font-size="22"><tspan x="64" dy="0">01 / 04</tspan></text><text x="64" y="241" class="heading" font-size="38"><tspan x="64" dy="0">How a reading is made</tspan></text><text x="64" y="309" class="body" font-size="27"><tspan x="64" dy="0">Follow the words, the readers and their disagreements.</tspan></text><path d="M64 348H374" class="rule"/><text x="64" y="386" class="red" font-size="24"><tspan x="64" dy="0">01</tspan></text><text x="64" y="428" class="card-title" font-size="27"><tspan x="64" dy="0">Sources</tspan></text><text x="64" y="469" class="body" font-size="22"><tspan x="64" dy="0">Immutable source</tspan><tspan x="64" dy="31">bytes, stored by</tspan><tspan x="64" dy="31">hash.</tspan></text><path d="M404 348H714" class="rule"/><text x="404" y="386" class="red" font-size="24"><tspan x="404" dy="0">02</tspan></text><text x="404" y="428" class="card-title" font-size="27"><tspan x="404" dy="0">Units + anchors</tspan></text><text x="404" y="469" class="body" font-size="22"><tspan x="404" dy="0">Signed posts; exact</tspan><tspan x="404" dy="31">ranges; checked</tspan><tspan x="404" dy="31">quotations.</tspan></text><path d="M745 348H1055" class="rule"/><text x="745" y="386" class="red" font-size="24"><tspan x="745" dy="0">03</tspan></text><text x="745" y="428" class="card-title" font-size="27"><tspan x="745" dy="0">Lenses</tspan></text><text x="745" y="469" class="body" font-size="22"><tspan x="745" dy="0">Reader,</tspan><tspan x="745" dy="31">instructions,</tspan><tspan x="745" dy="31">codebook, framing</tspan><tspan x="745" dy="31">and priors.</tspan></text><path d="M1085 348H1395" class="rule"/><text x="1085" y="386" class="red" font-size="24"><tspan x="1085" dy="0">04</tspan></text><text x="1085" y="428" class="card-title" font-size="27"><tspan x="1085" dy="0">Open coding</tspan></text><text x="1085" y="469" class="body" font-size="22"><tspan x="1085" dy="0">Three families name</tspan><tspan x="1085" dy="31">what they see.</tspan></text><path d="M1426 348H1736" class="rule"/><text x="1426" y="386" class="red" font-size="24"><tspan x="1426" dy="0">05</tspan></text><text x="1426" y="428" class="card-title" font-size="27"><tspan x="1426" dy="0">Two-layer</tspan><tspan x="1426" dy="38">codebook</tspan></text><text x="1426" y="507" class="body" font-size="22"><tspan x="1426" dy="0">31 words searched;</tspan><tspan x="1426" dy="31">52 acts judged.</tspan></text><path d="M64 599H374" class="rule"/><text x="64" y="637" class="red" font-size="24"><tspan x="64" dy="0">06</tspan></text><text x="64" y="679" class="card-title" font-size="27"><tspan x="64" dy="0">Focused coding</tspan></text><text x="64" y="720" class="body" font-size="22"><tspan x="64" dy="0">Same posts, three</tspan><tspan x="64" dy="31">independent</tspan><tspan x="64" dy="31">readers, signed</tspan><tspan x="64" dy="31">field notes.</tspan></text><path d="M404 599H714" class="rule"/><text x="404" y="637" class="red" font-size="24"><tspan x="404" dy="0">07</tspan></text><text x="404" y="679" class="card-title" font-size="27"><tspan x="404" dy="0">What had no</tspan><tspan x="404" dy="38">place</tspan></text><text x="404" y="758" class="body" font-size="22"><tspan x="404" dy="0">Unplaced passages</tspan><tspan x="404" dy="31">gathered and</tspan><tspan x="404" dy="31">grouped; not yet</tspan><tspan x="404" dy="31">coded.</tspan></text><path d="M745 599H1055" class="rule"/><text x="745" y="637" class="red" font-size="24"><tspan x="745" dy="0">08</tspan></text><text x="745" y="679" class="card-title" font-size="27"><tspan x="745" dy="0">The readers’</tspan><tspan x="745" dy="38">board</tspan></text><text x="745" y="758" class="body" font-size="22"><tspan x="745" dy="0">Three rounds;</tspan><tspan x="745" dy="31">notes, replies and</tspan><tspan x="745" dy="31">requested</tspan><tspan x="745" dy="31">statements.</tspan></text><path d="M1085 599H1395" class="rule"/><text x="1085" y="637" class="red" font-size="24"><tspan x="1085" dy="0">09</tspan></text><text x="1085" y="679" class="card-title" font-size="27"><tspan x="1085" dy="0">Theory, last</tspan></text><text x="1085" y="720" class="body" font-size="22"><tspan x="1085" dy="0">Declared framework,</tspan><tspan x="1085" dy="31">exact quotations,</tspan><tspan x="1085" dy="31">counter-evidence</tspan><tspan x="1085" dy="31">and rival.</tspan></text><path d="M1426 599H1736" class="rule"/><text x="1426" y="637" class="red" font-size="24"><tspan x="1426" dy="0">10</tspan></text><text x="1426" y="679" class="card-title" font-size="27"><tspan x="1426" dy="0">Verify</tspan></text><text x="1426" y="720" class="body" font-size="22"><tspan x="1426" dy="0">Check anchors</tspan><tspan x="1426" dy="31">against sources,</tspan><tspan x="1426" dy="31">records against</tspan><tspan x="1426" dy="31">lenses.</tspan></text><path d="M64 888H1736" class="red-line"/><text x="64" y="932" class="card-title" font-size="28"><tspan x="64" dy="0">One append-only ledger</tspan></text><text x="64" y="974" class="body" font-size="23"><tspan x="64" dy="0">Corrections add records; earlier records stay.</tspan></text><path d="M64 1021H1736" class="red-line"/><text x="64" y="1065" class="red" font-size="22"><tspan x="64" dy="0">02 / 04</tspan></text><text x="64" y="1120" class="heading" font-size="38"><tspan x="64" dy="0">Built and next</tspan></text><text x="64" y="1188" class="body" font-size="27"><tspan x="64" dy="0">Theory lenses are built; the next tests are listed beside them.</tspan></text><text x="64" y="1257" class="card-title" font-size="30"><tspan x="64" dy="0">Built this weekend</tspan></text><text x="950" y="1257" class="red" font-size="30"><tspan x="950" dy="0">On the build list</tspan></text><text x="64" y="1307" class="card-title" font-size="24"><tspan x="64" dy="0">The kernel</tspan></text><text x="64" y="1342" class="body" font-size="22"><tspan x="64" dy="0">Sources, anchors, lenses and verification.</tspan></text><text x="64" y="1392" class="card-title" font-size="24"><tspan x="64" dy="0">Ways in</tspan></text><text x="64" y="1427" class="body" font-size="22"><tspan x="64" dy="0">Wiki history; three routes to model readers.</tspan></text><text x="64" y="1477" class="card-title" font-size="24"><tspan x="64" dy="0">Ways of reading</tspan></text><text x="64" y="1512" class="body" font-size="22"><tspan x="64" dy="0">Open coding, codebooks, focused coding and field</tspan><tspan x="64" dy="31">notes.</tspan></text><text x="64" y="1593" class="card-title" font-size="24"><tspan x="64" dy="0">An encounter, kept</tspan></text><text x="64" y="1628" class="body" font-size="22"><tspan x="64" dy="0">Three board rounds; human judgments recorded.</tspan></text><text x="64" y="1678" class="card-title" font-size="24"><tspan x="64" dy="0">Views onto the record</tspan></text><text x="64" y="1713" class="body" font-size="22"><tspan x="64" dy="0">Words, names, reader differences and unplaced</tspan><tspan x="64" dy="31">passages.</tspan></text><text x="64" y="1794" class="card-title" font-size="24"><tspan x="64" dy="0">Ways out</tspan></text><text x="64" y="1829" class="body" font-size="22"><tspan x="64" dy="0">An audited site and public repository export.</tspan></text><text x="64" y="1879" class="card-title" font-size="24"><tspan x="64" dy="0">Theory lenses</tspan></text><text x="64" y="1914" class="body" font-size="22"><tspan x="64" dy="0">Frameworks, exact passages, counter-evidence and</tspan><tspan x="64" dy="31">rivals.</tspan></text><text x="950" y="1305" class="body" font-size="22"><tspan x="950" dy="0">— Counter-example searches by a different model</tspan><tspan x="950" dy="31">family.</tspan></text><text x="950" y="1382" class="body" font-size="22"><tspan x="950" dy="0">— Readers replying to one another’s theory</tspan><tspan x="950" dy="31">readings.</tspan></text><text x="950" y="1459" class="body" font-size="22"><tspan x="950" dy="0">— Codebook revision from unplaced passages; then</tspan><tspan x="950" dy="31">coding.</tspan></text><text x="950" y="1536" class="body" font-size="22"><tspan x="950" dy="0">— Human hand-coding beside the models’.</tspan></text><text x="950" y="1582" class="body" font-size="22"><tspan x="950" dy="0">— Same reader and posts, different frames.</tspan></text><text x="950" y="1628" class="body" font-size="22"><tspan x="950" dy="0">— Reply chains within a page.</tspan></text><text x="950" y="1674" class="body" font-size="22"><tspan x="950" dy="0">— Adapters for other corpora.</tspan></text><text x="950" y="1720" class="body" font-size="22"><tspan x="950" dy="0">— A live board.</tspan></text><path d="M899 1227L899 1971" class="rule" stroke-dasharray="9 7"/><path d="M64 1999H1736" class="red-line"/><text x="64" y="2043" class="red" font-size="22"><tspan x="64" dy="0">03 / 04</tspan></text><text x="64" y="2098" class="heading" font-size="38"><tspan x="64" dy="0">Why this matters for safety</tspan></text><text x="64" y="2166" class="body" font-size="27"><tspan x="64" dy="0">Keep the investigator’s choices visible in the evidence.</tspan></text><text x="64" y="2230" class="body" font-size="29"><tspan x="64" dy="0">— Trace interpretations back to exact source words.</tspan></text><text x="64" y="2289" class="body" font-size="29"><tspan x="64" dy="0">— Keep a reading and its correction together.</tspan></text><text x="64" y="2348" class="body" font-size="29"><tspan x="64" dy="0">— Inspect disagreement between independent readers.</tspan></text><path d="M64 2403H1736" class="red-line"/><text x="64" y="2447" class="red" font-size="22"><tspan x="64" dy="0">04 / 04</tspan></text><text x="64" y="2502" class="heading" font-size="38"><tspan x="64" dy="0">How theory becomes a lens</tspan></text><text x="64" y="2570" class="body" font-size="27"><tspan x="64" dy="0">A saved letter carries the framework into each reading.</tspan></text><text x="64" y="2634" class="body" font-size="29"><tspan x="64" dy="0">01  Declare a framework in the saved letter.</tspan></text><text x="64" y="2693" class="body" font-size="29"><tspan x="64" dy="0">02  Give each reader the counts and source passages.</tspan></text><text x="64" y="2752" class="body" font-size="29"><tspan x="64" dy="0">03  Read through the framework; quote the evidence.</tspan></text><text x="64" y="2811" class="body" font-size="29"><tspan x="64" dy="0">04  Name counter-evidence and the strongest rival.</tspan></text><path d="M64 2866H1736" class="red-line"/><text x="64" y="2910" class="heading" font-size="26"><tspan x="64" dy="0">A reading is answerable to its words, its reader and its rivals.</tspan></text>
</svg>
