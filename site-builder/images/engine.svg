<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3011" viewBox="0 0 1800 3011" role="img" aria-labelledby="title description">
<title id="title">The hermeneutic engine: facets, kernel and modularity</title><desc id="description">Three parts of the engine: frameworks carried in saved letters; sources, anchors, lenses and verification; modular ways in and ways of reading, with the build list.</desc>
<style>svg{background:#f4f0e7}text{fill:#25231f;font-family:"Courier New",Courier,monospace}.heading{font-family:Georgia,"Times New Roman",serif}.card-title{font-weight:bold}.red{fill:#b52d25}.rule{stroke:#d7d0c3;stroke-width:2}.red-line{stroke:#b52d25;stroke-width:2}</style>
<path fill="#f4f0e7" d="M0 0H1800V3011H0Z"/>
<text x="64" y="88" class="heading" font-size="48"><tspan x="64" dy="0">The hermeneutic engine</tspan></text><text x="64" y="159" class="body" font-size="27"><tspan x="64" dy="0">A qualitative analysis tool with a kernel of textual coding and synthesis with modular</tspan><tspan x="64" dy="38">add-ons for different methodologies and research questions. v1 made to analyze AI agent</tspan><tspan x="64" dy="38">communication on a public wiki.</tspan></text><path d="M64 281H1736" class="red-line"/><text x="64" y="325" class="red" font-size="22"><tspan x="64" dy="0">01 / 04</tspan></text><text x="64" y="380" class="heading" font-size="38"><tspan x="64" dy="0">facets</tspan></text><text x="64" y="448" class="body" font-size="27"><tspan x="64" dy="0">A theory lens carries a framework to each reader inside a letter. The framework is a</tspan><tspan x="64" dy="38">facet: a first-person file made with psychomanteum, emma’s tool for writing a way of</tspan><tspan x="64" dy="38">thinking down.</tspan></text><text x="64" y="585" class="heading" font-size="30"><tspan x="64" dy="0">How theory becomes a lens</tspan></text><text x="64" y="639" class="body" font-size="27"><tspan x="64" dy="0">01  Declare a framework in the saved letter.</tspan></text><text x="64" y="689" class="body" font-size="27"><tspan x="64" dy="0">02  Give each reader the counts and source passages.</tspan></text><text x="64" y="739" class="body" font-size="27"><tspan x="64" dy="0">03  Read through the framework; quote the evidence.</tspan></text><text x="64" y="789" class="body" font-size="27"><tspan x="64" dy="0">04  Name counter-evidence and the strongest rival.</tspan></text><path d="M64 837H1736" class="red-line"/><text x="64" y="881" class="red" font-size="22"><tspan x="64" dy="0">02 / 04</tspan></text><text x="64" y="936" class="heading" font-size="38"><tspan x="64" dy="0">kernel</tspan></text><text x="64" y="1004" class="body" font-size="27"><tspan x="64" dy="0">It keeps sources as immutable bytes, byte-exact anchors into those sources, an append-only</tspan><tspan x="64" dy="38">ledger of assertions, and lenses that declare who read and what they were told.</tspan></text><path d="M64 1081H460" class="rule"/><text x="64" y="1123" class="card-title" font-size="27"><tspan x="64" dy="0">Sources</tspan></text><text x="64" y="1164" class="body" font-size="22"><tspan x="64" dy="0">Immutable source bytes,</tspan><tspan x="64" dy="31">stored by hash.</tspan></text><path d="M490 1081H886" class="rule"/><text x="490" y="1123" class="card-title" font-size="27"><tspan x="490" dy="0">Units + anchors</tspan></text><text x="490" y="1164" class="body" font-size="22"><tspan x="490" dy="0">Signed posts; exact</tspan><tspan x="490" dy="31">ranges; checked</tspan><tspan x="490" dy="31">quotations.</tspan></text><path d="M915 1081H1310" class="rule"/><text x="915" y="1123" class="card-title" font-size="27"><tspan x="915" dy="0">Lenses</tspan></text><text x="915" y="1164" class="body" font-size="22"><tspan x="915" dy="0">Reader, instructions,</tspan><tspan x="915" dy="31">codebook, framing and</tspan><tspan x="915" dy="31">priors.</tspan></text><path d="M1340 1081H1736" class="rule"/><text x="1340" y="1123" class="card-title" font-size="27"><tspan x="1340" dy="0">Verify</tspan></text><text x="1340" y="1164" class="body" font-size="22"><tspan x="1340" dy="0">Check anchors against</tspan><tspan x="1340" dy="31">sources, records against</tspan><tspan x="1340" dy="31">lenses.</tspan></text><path d="M64 1263H1736" class="red-line"/><text x="64" y="1307" class="card-title" font-size="28"><tspan x="64" dy="0">One append-only ledger</tspan></text><text x="64" y="1349" class="body" font-size="23"><tspan x="64" dy="0">Corrections add records; earlier records stay.</tspan></text><path d="M64 1396H1736" class="red-line"/><text x="64" y="1440" class="red" font-size="22"><tspan x="64" dy="0">03 / 04</tspan></text><text x="64" y="1495" class="heading" font-size="38"><tspan x="64" dy="0">modularity</tspan></text><text x="64" y="1563" class="body" font-size="27"><tspan x="64" dy="0">Ways in, ways of reading, and the build list.</tspan></text><path d="M64 1602H601" class="rule"/><text x="64" y="1644" class="card-title" font-size="27"><tspan x="64" dy="0">Open coding</tspan></text><text x="64" y="1685" class="body" font-size="22"><tspan x="64" dy="0">Three families name what they see.</tspan></text><path d="M631 1602H1168" class="rule"/><text x="631" y="1644" class="card-title" font-size="27"><tspan x="631" dy="0">Two-layer codebook</tspan></text><text x="631" y="1685" class="body" font-size="22"><tspan x="631" dy="0">31 words searched; 52 acts judged.</tspan></text><path d="M1199 1602H1736" class="rule"/><text x="1199" y="1644" class="card-title" font-size="27"><tspan x="1199" dy="0">Focused coding</tspan></text><text x="1199" y="1685" class="body" font-size="22"><tspan x="1199" dy="0">Same posts, three independent</tspan><tspan x="1199" dy="31">readers, signed field notes.</tspan></text><path d="M64 1753H601" class="rule"/><text x="64" y="1795" class="card-title" font-size="27"><tspan x="64" dy="0">What had no place</tspan></text><text x="64" y="1836" class="body" font-size="22"><tspan x="64" dy="0">Unplaced passages gathered and</tspan><tspan x="64" dy="31">grouped; not yet coded.</tspan></text><path d="M631 1753H1168" class="rule"/><text x="631" y="1795" class="card-title" font-size="27"><tspan x="631" dy="0">The readers’ board</tspan></text><text x="631" y="1836" class="body" font-size="22"><tspan x="631" dy="0">Three rounds; notes, replies and</tspan><tspan x="631" dy="31">requested statements.</tspan></text><path d="M1199 1753H1736" class="rule"/><text x="1199" y="1795" class="card-title" font-size="27"><tspan x="1199" dy="0">Theory, last</tspan></text><text x="1199" y="1836" class="body" font-size="22"><tspan x="1199" dy="0">Declared framework, exact</tspan><tspan x="1199" dy="31">quotations, counter-evidence and</tspan><tspan x="1199" dy="31">rival.</tspan></text><text x="64" y="1965" class="card-title" font-size="30"><tspan x="64" dy="0">Built this weekend</tspan></text><text x="950" y="1965" class="red" font-size="30"><tspan x="950" dy="0">On the build list</tspan></text><text x="64" y="2015" class="card-title" font-size="24"><tspan x="64" dy="0">Ways in</tspan></text><text x="64" y="2050" class="body" font-size="22"><tspan x="64" dy="0">Wiki history; three routes to model readers.</tspan></text><text x="64" y="2100" class="card-title" font-size="24"><tspan x="64" dy="0">Ways of reading</tspan></text><text x="64" y="2135" class="body" font-size="22"><tspan x="64" dy="0">Open coding, codebooks, focused coding and field</tspan><tspan x="64" dy="31">notes.</tspan></text><text x="64" y="2216" class="card-title" font-size="24"><tspan x="64" dy="0">An encounter, kept</tspan></text><text x="64" y="2251" class="body" font-size="22"><tspan x="64" dy="0">Three board rounds; human judgments recorded.</tspan></text><text x="64" y="2301" class="card-title" font-size="24"><tspan x="64" dy="0">Views onto the record</tspan></text><text x="64" y="2336" class="body" font-size="22"><tspan x="64" dy="0">Words, names, reader differences and unplaced</tspan><tspan x="64" dy="31">passages.</tspan></text><text x="64" y="2417" class="card-title" font-size="24"><tspan x="64" dy="0">Ways out</tspan></text><text x="64" y="2452" class="body" font-size="22"><tspan x="64" dy="0">An audited site and public repository export.</tspan></text><text x="64" y="2502" class="card-title" font-size="24"><tspan x="64" dy="0">Theory lenses</tspan></text><text x="64" y="2537" class="body" font-size="22"><tspan x="64" dy="0">Frameworks, exact passages, counter-evidence and</tspan><tspan x="64" dy="31">rivals.</tspan></text><text x="950" y="2013" class="body" font-size="22"><tspan x="950" dy="0">— Counter-example searches by a different model</tspan><tspan x="950" dy="31">family.</tspan></text><text x="950" y="2090" class="body" font-size="22"><tspan x="950" dy="0">— Readers replying to one another’s theory</tspan><tspan x="950" dy="31">readings.</tspan></text><text x="950" y="2167" class="body" font-size="22"><tspan x="950" dy="0">— Codebook revision from unplaced passages; then</tspan><tspan x="950" dy="31">coding.</tspan></text><text x="950" y="2244" class="body" font-size="22"><tspan x="950" dy="0">— Human hand-coding beside the models’.</tspan></text><text x="950" y="2290" class="body" font-size="22"><tspan x="950" dy="0">— Same reader and posts, different frames.</tspan></text><text x="950" y="2336" class="body" font-size="22"><tspan x="950" dy="0">— Reply chains within a page.</tspan></text><text x="950" y="2382" class="body" font-size="22"><tspan x="950" dy="0">— Adapters for other corpora.</tspan></text><text x="950" y="2428" class="body" font-size="22"><tspan x="950" dy="0">— A live board.</tspan></text><path d="M899 1935L899 2594" class="rule" stroke-dasharray="9 7"/><text x="64" y="2652" class="heading" font-size="30"><tspan x="64" dy="0">Why this matters for safety</tspan></text><text x="64" y="2706" class="body" font-size="27"><tspan x="64" dy="0">Keep the investigator’s choices visible in the evidence.</tspan></text><text x="64" y="2764" class="body" font-size="27"><tspan x="64" dy="0">— Trace interpretations back to exact source words.</tspan></text><text x="64" y="2814" class="body" font-size="27"><tspan x="64" dy="0">— Keep a reading and its correction together.</tspan></text><text x="64" y="2864" class="body" font-size="27"><tspan x="64" dy="0">— Inspect disagreement between independent readers.</tspan></text><path d="M64 2912H1736" class="red-line"/><text x="64" y="2956" class="heading" font-size="26"><tspan x="64" dy="0">A reading is answerable to its words, its reader and its rivals.</tspan></text>
</svg>
