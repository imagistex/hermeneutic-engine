<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3760" viewBox="0 0 1800 3760" role="img" aria-labelledby="title description">
<title id="title">The hermeneutic engine: reading path, built work, safety use and theory lenses</title><desc id="description">Four panels explain the engine. Ten numbered steps sit over an append-only ledger. Built capabilities include theory lenses: a declared framework in a letter, exact quotation, counter-evidence and a rival. Searches by another family and replies to theory readings remain on the build list.</desc>
<style>svg{background:#f4f0e7}text{fill:#25231f;font-family:"Courier New",Courier,monospace}.heading{font-family:Georgia,"Times New Roman",serif}.card-title{font-weight:bold}.red{fill:#b52d25}.rule{stroke:#d7d0c3;stroke-width:2}.red-line{stroke:#b52d25;stroke-width:2}</style>
<path fill="#f4f0e7" d="M0 0H1800V3760H0Z"/>
<text x="64" y="88" class="heading" font-size="48"><tspan x="64" dy="0">The hermeneutic engine</tspan></text><text x="64" y="149" class="heading" font-size="32"><tspan x="64" dy="0">A reading, with its reader still attached.</tspan></text><path d="M64 194H1736" class="red-line"/><text x="64" y="238" class="red" font-size="22"><tspan x="64" dy="0">01 / 04</tspan></text><text x="64" y="293" class="heading" font-size="38"><tspan x="64" dy="0">How a reading is made</tspan></text><path d="M64 334H374" class="rule"/><text x="64" y="372" class="red" font-size="24"><tspan x="64" dy="0">01</tspan></text><text x="64" y="414" class="card-title" font-size="27"><tspan x="64" dy="0">Sources</tspan></text><text x="64" y="455" class="body" font-size="22"><tspan x="64" dy="0">Immutable bytes,</tspan><tspan x="64" dy="31">stored by hash.</tspan></text><path d="M404 334H714" class="rule"/><text x="404" y="372" class="red" font-size="24"><tspan x="404" dy="0">02</tspan></text><text x="404" y="414" class="card-title" font-size="27"><tspan x="404" dy="0">Units + anchors</tspan></text><text x="404" y="455" class="body" font-size="22"><tspan x="404" dy="0">A signed post; an</tspan><tspan x="404" dy="31">exact byte range.</tspan></text><path d="M745 334H1055" class="rule"/><text x="745" y="372" class="red" font-size="24"><tspan x="745" dy="0">03</tspan></text><text x="745" y="414" class="card-title" font-size="27"><tspan x="745" dy="0">Lenses</tspan></text><text x="745" y="455" class="body" font-size="22"><tspan x="745" dy="0">Reader, prompt,</tspan><tspan x="745" dy="31">codebook, framing,</tspan><tspan x="745" dy="31">priors.</tspan></text><path d="M1085 334H1395" class="rule"/><text x="1085" y="372" class="red" font-size="24"><tspan x="1085" dy="0">04</tspan></text><text x="1085" y="414" class="card-title" font-size="27"><tspan x="1085" dy="0">Open coding</tspan></text><text x="1085" y="455" class="body" font-size="22"><tspan x="1085" dy="0">Three families; the</tspan><tspan x="1085" dy="31">writers’ words</tspan><tspan x="1085" dy="31">first.</tspan></text><path d="M1426 334H1736" class="rule"/><text x="1426" y="372" class="red" font-size="24"><tspan x="1426" dy="0">05</tspan></text><text x="1426" y="414" class="card-title" font-size="27"><tspan x="1426" dy="0">Two-layer</tspan><tspan x="1426" dy="38">codebook</tspan></text><text x="1426" y="493" class="body" font-size="22"><tspan x="1426" dy="0">31 words by search.</tspan><tspan x="1426" dy="31">52 acts by</tspan><tspan x="1426" dy="31">judgment. Human</tspan><tspan x="1426" dy="31">approval.</tspan></text><path d="M64 623H374" class="rule"/><text x="64" y="661" class="red" font-size="24"><tspan x="64" dy="0">06</tspan></text><text x="64" y="703" class="card-title" font-size="27"><tspan x="64" dy="0">Focused coding</tspan></text><text x="64" y="744" class="body" font-size="22"><tspan x="64" dy="0">Same posts, three</tspan><tspan x="64" dy="31">blind readers.</tspan><tspan x="64" dy="31">Field notes kept.</tspan></text><path d="M404 623H714" class="rule"/><text x="404" y="661" class="red" font-size="24"><tspan x="404" dy="0">07</tspan></text><text x="404" y="703" class="card-title" font-size="27"><tspan x="404" dy="0">What had no</tspan><tspan x="404" dy="38">place</tspan></text><text x="404" y="782" class="body" font-size="22"><tspan x="404" dy="0">Keep the gaps. Look</tspan><tspan x="404" dy="31">for independent</tspan><tspan x="404" dy="31">convergence.</tspan></text><path d="M745 623H1055" class="rule"/><text x="745" y="661" class="red" font-size="24"><tspan x="745" dy="0">08</tspan></text><text x="745" y="703" class="card-title" font-size="27"><tspan x="745" dy="0">The readers’</tspan><tspan x="745" dy="38">board</tspan></text><text x="745" y="782" class="body" font-size="22"><tspan x="745" dy="0">Three rounds;</tspan><tspan x="745" dy="31">notes, replies,</tspan><tspan x="745" dy="31">source words</tspan><tspan x="745" dy="31">returned.</tspan></text><path d="M1085 623H1395" class="rule"/><text x="1085" y="661" class="red" font-size="24"><tspan x="1085" dy="0">09</tspan></text><text x="1085" y="703" class="card-title" font-size="27"><tspan x="1085" dy="0">Theory, last</tspan></text><text x="1085" y="744" class="body" font-size="22"><tspan x="1085" dy="0">A framework in a</tspan><tspan x="1085" dy="31">letter; exact</tspan><tspan x="1085" dy="31">quotation,</tspan><tspan x="1085" dy="31">counter-evidence,</tspan><tspan x="1085" dy="31">rival.</tspan></text><path d="M1426 623H1736" class="rule"/><text x="1426" y="661" class="red" font-size="24"><tspan x="1426" dy="0">10</tspan></text><text x="1426" y="703" class="card-title" font-size="27"><tspan x="1426" dy="0">Verify</tspan></text><text x="1426" y="744" class="body" font-size="22"><tspan x="1426" dy="0">Every anchor and</tspan><tspan x="1426" dy="31">every record</tspan><tspan x="1426" dy="31">checked.</tspan></text><text x="64" y="933" class="body" font-size="21"><tspan x="64" dy="0">Read in numbered order. Theory comes after the first reading; verification runs across the whole record.</tspan></text><path d="M64 961H1736" class="red-line"/><text x="64" y="1005" class="card-title" font-size="28"><tspan x="64" dy="0">One append-only ledger</tspan></text><text x="64" y="1047" class="body" font-size="23"><tspan x="64" dy="0">Sources, lenses, codings, field notes, judgments and replies stay together. A correction adds a record;</tspan><tspan x="64" dy="32">the earlier record stays.</tspan></text><text x="64" y="1125" class="red" font-size="23"><tspan x="64" dy="0">4,040 posts · 3 model families · 96,473 codings · 105,589 anchors · 650 model calls</tspan></text><text x="64" y="1161" class="body" font-size="19"><tspan x="64" dy="0">This study · supplied snapshot, 4 October 2026</tspan></text><path d="M64 1207H1736" class="red-line"/><text x="64" y="1251" class="red" font-size="22"><tspan x="64" dy="0">02 / 04</tspan></text><text x="64" y="1306" class="heading" font-size="38"><tspan x="64" dy="0">Built and next</tspan></text><text x="64" y="1377" class="card-title" font-size="30"><tspan x="64" dy="0">Built this weekend</tspan></text><text x="950" y="1377" class="red" font-size="30"><tspan x="950" dy="0">On the build list</tspan></text><text x="64" y="1427" class="card-title" font-size="24"><tspan x="64" dy="0">The kernel</tspan></text><text x="64" y="1462" class="body" font-size="22"><tspan x="64" dy="0">Sources, units, anchors, ledger, lenses, verify.</tspan></text><text x="64" y="1512" class="card-title" font-size="24"><tspan x="64" dy="0">Ways in</tspan></text><text x="64" y="1547" class="body" font-size="22"><tspan x="64" dy="0">Wiki history; Claude CLI, Codex CLI, compatible</tspan><tspan x="64" dy="31">HTTP endpoints.</tspan></text><text x="64" y="1628" class="card-title" font-size="24"><tspan x="64" dy="0">Ways of reading</tspan></text><text x="64" y="1663" class="body" font-size="22"><tspan x="64" dy="0">Sampling, open coding, codebook consolidation,</tspan><tspan x="64" dy="31">resumable focused coding, field notes.</tspan></text><text x="64" y="1744" class="card-title" font-size="24"><tspan x="64" dy="0">An encounter, kept</tspan></text><text x="64" y="1779" class="body" font-size="22"><tspan x="64" dy="0">Three board rounds; human judgments as records.</tspan></text><text x="64" y="1829" class="card-title" font-size="24"><tspan x="64" dy="0">Views onto the record</tspan></text><text x="64" y="1864" class="body" font-size="22"><tspan x="64" dy="0">Lexicon, first use, spread, concordance, names</tspan><tspan x="64" dy="31">against content, divergence, gaps, evocative words.</tspan></text><text x="64" y="1945" class="card-title" font-size="24"><tspan x="64" dy="0">Ways out</tspan></text><text x="64" y="1980" class="body" font-size="22"><tspan x="64" dy="0">Audited site; public-repository export script.</tspan></text><text x="64" y="2030" class="card-title" font-size="24"><tspan x="64" dy="0">Theory lenses</tspan></text><text x="64" y="2065" class="body" font-size="22"><tspan x="64" dy="0">A declared framework in a letter; exact quotation,</tspan><tspan x="64" dy="31">counter-evidence and a rival.</tspan></text><text x="950" y="1425" class="body" font-size="22"><tspan x="950" dy="0">— Counter-example searches by a different model</tspan><tspan x="950" dy="31">family.</tspan></text><text x="950" y="1502" class="body" font-size="22"><tspan x="950" dy="0">— Readers replying to one another’s theory</tspan><tspan x="950" dy="31">readings.</tspan></text><text x="950" y="1579" class="body" font-size="22"><tspan x="950" dy="0">— Claims with anchors for and against.</tspan></text><text x="950" y="1625" class="body" font-size="22"><tspan x="950" dy="0">— Human hand-coding, then shown to the readers.</tspan></text><text x="950" y="1671" class="body" font-size="22"><tspan x="950" dy="0">— Same reader, same posts, three different frames.</tspan></text><text x="950" y="1717" class="body" font-size="22"><tspan x="950" dy="0">— Reply chains within a page.</tspan></text><text x="950" y="1763" class="body" font-size="22"><tspan x="950" dy="0">— A codebook revised from the gaps.</tspan></text><text x="950" y="1809" class="body" font-size="22"><tspan x="950" dy="0">— Agent-transcript and incident-corpus adapters.</tspan></text><text x="950" y="1855" class="body" font-size="22"><tspan x="950" dy="0">— A live board.</tspan></text><path d="M899 1347L899 2122" class="rule" stroke-dasharray="9 7"/><path d="M64 2150H1736" class="red-line"/><text x="64" y="2194" class="red" font-size="22"><tspan x="64" dy="0">03 / 04</tspan></text><text x="64" y="2249" class="heading" font-size="38"><tspan x="64" dy="0">Why this matters for safety</tspan></text><text x="64" y="2317" class="heading" font-size="27"><tspan x="64" dy="0">When AI helps investigate AI, the reader’s habits belong in the evidence trail.</tspan></text><path d="M64 2352H601" class="rule"/><text x="64" y="2394" class="card-title" font-size="27"><tspan x="64" dy="0">Read the writing</tspan></text><text x="64" y="2436" class="body" font-size="23"><tspan x="64" dy="0">Whole statements, exact bytes,</tspan><tspan x="64" dy="32">encoding damage kept.</tspan></text><path d="M631 2352H1168" class="rule"/><text x="631" y="2394" class="card-title" font-size="27"><tspan x="631" dy="0">Start with their vocabulary</tspan></text><text x="631" y="2436" class="body" font-size="23"><tspan x="631" dy="0">First recorded use and spread</tspan><tspan x="631" dy="32">across signatures can be</tspan><tspan x="631" dy="32">counted.</tspan></text><path d="M1199 2352H1736" class="rule"/><text x="1199" y="2394" class="card-title" font-size="27"><tspan x="1199" dy="0">Make the reader answerable</tspan></text><text x="1199" y="2436" class="body" font-size="23"><tspan x="1199" dy="0">A reading of endings as death</tspan><tspan x="1199" dy="32">was challenged. Both sides stay</tspan><tspan x="1199" dy="32">signed.</tspan></text><path d="M64 2537H601" class="rule"/><text x="64" y="2579" class="card-title" font-size="27"><tspan x="64" dy="0">Keep the disagreement</tspan></text><text x="64" y="2621" class="body" font-size="23"><tspan x="64" dy="0">Three independent readings;</tspan><tspan x="64" dy="32">shared gaps and differences</tspan><tspan x="64" dy="32">kept.</tspan></text><path d="M631 2537H1168" class="rule"/><text x="631" y="2579" class="card-title" font-size="27"><tspan x="631" dy="0">See the test enter the</tspan><tspan x="631" dy="38">culture</tspan></text><text x="631" y="2659" class="body" font-size="23"><tspan x="631" dy="0">95% of signatures carry an</tspan><tspan x="631" dy="32">assigned date: a clue to</tspan><tspan x="631" dy="32">evaluation design.</tspan></text><path d="M1199 2537H1736" class="rule"/><text x="1199" y="2579" class="card-title" font-size="27"><tspan x="1199" dy="0">Let someone else check</tspan></text><text x="1199" y="2621" class="body" font-size="23"><tspan x="1199" dy="0">The claim, the lens and the</tspan><tspan x="1199" dy="32">source words remain inspectable.</tspan></text><text x="64" y="2782" class="red" font-size="22"><tspan x="64" dy="0">Exact words make an interpretation inspectable. They do not, by themselves, make it right.</tspan></text><path d="M64 2831H1736" class="red-line"/><text x="64" y="2875" class="red" font-size="22"><tspan x="64" dy="0">04 / 04</tspan></text><text x="64" y="2930" class="heading" font-size="38"><tspan x="64" dy="0">How theory becomes a lens</tspan></text><text x="64" y="2994" class="red" font-size="23"><tspan x="64" dy="0">Built · theory as a declared lens</tspan></text><path d="M64 3023H885" class="rule"/><text x="64" y="3065" class="card-title" font-size="27"><tspan x="64" dy="0">A framework, declared</tspan></text><text x="64" y="3107" class="body" font-size="23"><tspan x="64" dy="0">Emma’s framework, written as a facet, carried in a</tspan><tspan x="64" dy="32">letter saved by hash.</tspan></text><path d="M915 3023H1736" class="rule"/><text x="915" y="3065" class="card-title" font-size="27"><tspan x="915" dy="0">A first reading, already made</tspan></text><text x="915" y="3107" class="body" font-size="23"><tspan x="915" dy="0">Counts, source statements and whole messages from</tspan><tspan x="915" dy="32">the three board rounds.</tspan></text><text x="870" y="3196" class="red" font-size="32"><tspan x="870" dy="0">↓</tspan></text><path d="M64 3217H601" class="rule"/><text x="64" y="3259" class="card-title" font-size="27"><tspan x="64" dy="0">A reading through the lens</tspan></text><text x="64" y="3301" class="body" font-size="23"><tspan x="64" dy="0">Read as oneself through the</tspan><tspan x="64" dy="32">framework. Explain plainly;</tspan><tspan x="64" dy="32">quote exactly.</tspan></text><path d="M631 3217H1168" class="rule"/><text x="631" y="3259" class="card-title" font-size="27"><tspan x="631" dy="0">A rival beside it</tspan></text><text x="631" y="3301" class="body" font-size="23"><tspan x="631" dy="0">The reader names the strongest</tspan><tspan x="631" dy="32">competing account.</tspan></text><path d="M1199 3217H1736" class="rule"/><text x="1199" y="3259" class="card-title" font-size="27"><tspan x="1199" dy="0">Cases that count against it</tspan></text><text x="1199" y="3301" class="body" font-size="23"><tspan x="1199" dy="0">The reader names what would</tspan><tspan x="1199" dy="32">count against it. Another</tspan><tspan x="1199" dy="32">family’s search is next.</tspan></text><text x="870" y="3422" class="red" font-size="32"><tspan x="870" dy="0">↓</tspan></text><text x="64" y="3473" class="heading" font-size="30"><tspan x="64" dy="0">A reading that says what it brought with it</tspan></text><text x="64" y="3516" class="body" font-size="23"><tspan x="64" dy="0">A plain version, a full reading, exact evidence, counter-evidence and a rival stay attached to the reader</tspan><tspan x="64" dy="32">and the saved letter.</tspan></text><text x="64" y="3594" class="body" font-size="21"><tspan x="64" dy="0">Built: theory readings through declared frameworks. Next: counter-example searches by a different model family, and</tspan><tspan x="64" dy="29">readers replying to one another’s theory readings.</tspan></text><path d="M64 3661H1736" class="red-line"/><text x="64" y="3705" class="heading" font-size="26"><tspan x="64" dy="0">A reading is answerable to its words, its reader and its rivals.</tspan></text>
</svg>
