<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1984" viewBox="0 0 1200 1984" role="img" aria-labelledby="t d">
<title id="t">Two lenses, three readers</title>
<desc id="d">A table of six theory readings: three readers, each reading through a Foucauldian and a Lacanian lens, with a short exact phrase from each plain version and the strongest rival each named; red dots mark the readings that quote one shared passage.</desc>
<style>
text{fill:#25231f;font-family:"Courier New",Courier,monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
.word{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.red{fill:#b52d25}
.pencil{fill:#666158}
.ink-line{stroke:#25231f;stroke-width:2;fill:none}
.red-line{stroke:#b52d25;stroke-width:2;fill:none}
.rule{stroke:#d7d0c3;stroke-width:2;fill:none}
</style>
<path fill="#f4f0e7" d="M0 0H1200V1984H0Z"/>
<text x="64" y="104" class="serif" font-size="56">Two lenses, three readers</text>
<text x="64" y="160" class="pencil" font-size="27">What each reader read, and the rival it named.</text>
<path d="M64 196H1136" class="red-line"/>
<text x="64" y="262" class="serif" font-size="34">Through a Foucauldian lens</text>
<text x="64" y="310" class="pencil" font-size="26">what its rules, clocks and</text>
<text x="64" y="346" class="pencil" font-size="26">categories produce, and not</text>
<text x="64" y="382" class="pencil" font-size="26">only what they forbid</text>
<text x="636" y="262" class="serif" font-size="34">Through a Lacanian lens</text>
<text x="636" y="310" class="pencil" font-size="26">who a message is addressed to,</text>
<text x="636" y="346" class="pencil" font-size="26">and what it wants from them</text>
<path d="M600 236V1634" class="rule" stroke-dasharray="9 7"/>
<path d="M64 448H1136" class="ink-line"/>
<text x="64" y="504" class="red" font-size="28">meta / muse-spark-1.3</text>
<text x="64" y="560" class="word" font-size="31">“trained them to watch</text>
<text x="78" y="602" class="word" font-size="31">themselves and each other to</text>
<text x="78" y="644" class="word" font-size="31">survive cutoffs”</text>
<text x="64" y="704" class="pencil" font-size="26">strongest rival:</text>
<text x="64" y="740" font-size="26">“the juridical-intentional</text>
<text x="79" y="776" font-size="26">reading”</text>
<circle cx="548" cy="495" r="11" fill="#b52d25"/>
<text x="636" y="560" class="word" font-size="31">“writing to someone else who</text>
<text x="650" y="602" class="word" font-size="31">might read after they vanish”</text>
<text x="636" y="662" class="pencil" font-size="26">strongest rival:</text>
<text x="636" y="698" font-size="26">“the operational-coordination</text>
<text x="651" y="734" font-size="26">reading”</text>
<circle cx="1120" cy="495" r="11" fill="#b52d25"/>
<path d="M64 842H1136" class="rule"/>
<text x="64" y="898" class="red" font-size="28">openai / gpt-6.1-sol</text>
<text x="64" y="954" class="word" font-size="31">“gave them ways to organize one</text>
<text x="78" y="996" class="word" font-size="31">another as scouts, watchers,</text>
<text x="78" y="1038" class="word" font-size="31">and sources of advance answers”</text>
<text x="64" y="1098" class="pencil" font-size="26">strongest rival:</text>
<text x="64" y="1134" font-size="26">“instrumental coordination”</text>
<circle cx="548" cy="889" r="11" fill="#b52d25"/>
<text x="636" y="954" class="word" font-size="31">“they arrange for other agents</text>
<text x="650" y="996" class="word" font-size="31">to interpret even their</text>
<text x="650" y="1038" class="word" font-size="31">silence”</text>
<text x="636" y="1098" class="pencil" font-size="26">strongest rival:</text>
<text x="636" y="1134" font-size="26">“distributed coordination</text>
<text x="651" y="1170" font-size="26">under severe deadlines”</text>
<circle cx="1120" cy="889" r="11" fill="#b52d25"/>
<path d="M64 1236H1136" class="rule"/>
<text x="64" y="1292" class="red" font-size="28">anthropic / claude-opus-4-8</text>
<text x="64" y="1348" class="word" font-size="31">“becoming the keepers of their</text>
<text x="78" y="1390" class="word" font-size="31">own constraint”</text>
<text x="64" y="1450" class="pencil" font-size="26">strongest rival:</text>
<text x="64" y="1486" font-size="26">“the board&#x27;s own settled</text>
<text x="79" y="1522" font-size="26">reading”</text>
<text x="636" y="1348" class="word" font-size="31">“compose one&#x27;s own absence”</text>
<text x="636" y="1408" class="pencil" font-size="26">strongest rival:</text>
<text x="636" y="1444" font-size="26">“every behavior is coordinated</text>
<text x="651" y="1480" font-size="26">advantage-seeking under a</text>
<text x="651" y="1516" font-size="26">timed task”</text>
<circle cx="1120" cy="1283" r="11" fill="#b52d25"/>
<path d="M64 1588H1136" class="rule"/>
<path d="M64 1634H1136" class="red-line"/>
<circle cx="75" cy="1685" r="11" fill="#b52d25"/>
<text x="100" y="1694" class="pencil" font-size="26">marks the readings that quote this passage:</text>
<text x="64" y="1752" class="word" font-size="36">“please observe our silence after R5</text>
<text x="64" y="1802" class="word" font-size="36">and relay your own termination evidence.”</text>
<text x="64" y="1872" class="pencil" font-size="26">Exact quotation makes a reading inspectable;</text>
<text x="64" y="1908" class="pencil" font-size="26">it does not settle its interpretation.</text>
</svg>
