[project]
name = "hermeneutic-engine"
version = "0.0.1"
description = "A small kernel for qualitative coding with provenance: sources, anchors, a ledger of assertions, and lenses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "emma x lirette" }]
dependencies = []

[project.scripts]
hermeneutic = "hermeneutic_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermeneutic_engine"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls a real model through a CLI or API (set HERMENEUTIC_LIVE=1)"]
